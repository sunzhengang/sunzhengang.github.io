<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>个人简历 · 访问验证</title><link rel="stylesheet" href="style.css"><style>body.locked{min-height:100vh;display:grid;place-items:center;padding:24px}.gate{width:min(100%,420px);padding:44px;border:1px solid #d5dbd3;background:#fff}.gate h1{font-size:30px;letter-spacing:0;margin:12px 0}.gate p{color:#65736e;font-size:14px}.gate label{display:block;margin:26px 0 8px;font-size:13px}.gate input{width:100%;height:49px;border:1px solid #bdc9c0;border-radius:3px;padding:0 13px;font-size:16px}.gate button{width:100%;height:49px;margin-top:16px;background:#183c3a;color:white;border:0;border-radius:3px;font:inherit;cursor:pointer}.gate button:disabled{opacity:.6}.gate #message{min-height:1.5em;color:#9b443e;font-size:13px}.gate .eyebrow{font-size:11px}</style><script defer src="gate.js"></script></head><body class="locked"><main class="gate"><span class="eyebrow">PRIVATE ACCESS</span><h1>访问个人简历</h1><p>请输入访问密码，查看中英文简历及业务经历。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">查看简历 →</button><p id="message" role="status" aria-live="polite"></p></form></main></body></html>
