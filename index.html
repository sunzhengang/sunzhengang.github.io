<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>个人简历 · 访问验证</title><link rel="stylesheet" href="style.css"><style>body.locked{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f5f1}.gate{position:relative;width:min(100%,480px);padding:0 0 32px;border-top:1px solid #1d2427;border-bottom:1px solid #1d2427}.gate:before{content:"ZS / 孙振刚";display:block;padding:20px 0 57px;border-bottom:1px solid #c9ceca;margin-bottom:34px;font:750 12px/1.5 var(--sans);letter-spacing:.04em;color:#1d2427}.gate:after{content:"01 / PRIVATE ACCESS";position:absolute;top:21px;right:0;font:700 10px/1.5 var(--sans);letter-spacing:.08em;color:#244bc1}.gate h1{font:500 40px/1.2 var(--serif);letter-spacing:0;margin:18px 0}.gate p{color:#65706d;font-size:14px}.gate label{display:block;margin:34px 0 8px;font-size:12px;font-weight:650}.gate input{width:100%;height:51px;background:transparent;border:1px solid #b9c2bb;padding:0 14px;font-size:16px}.gate button{width:100%;height:51px;margin-top:14px;background:#1d2427;color:white;border:0;font:650 13px var(--sans);cursor:pointer}.gate button:hover{background:#244bc1}.gate button:disabled{opacity:.6}.gate #message{min-height:1.5em;color:#9b443e;font-size:13px}.gate .eyebrow{font-size:10px}@media(max-width:500px){.gate:before{padding-bottom:40px}}</style><script defer src="gate.js"></script></head><body class="locked"><main class="gate"><span class="eyebrow">PRIVATE ACCESS</span><h1>访问个人简历</h1><p>请输入访问密码，查看中英文简历及业务经历。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">查看简历 →</button><p id="message" role="status" aria-live="polite"></p></form></main></body></html>
