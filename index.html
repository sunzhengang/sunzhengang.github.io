<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>个人简历 · 访问验证</title><link rel="stylesheet" href="style.css"><style>body.locked{min-height:100vh;display:grid;place-items:center;padding:24px;background:#142839;background-image:radial-gradient(circle at 78% 20%,#38535b 0,transparent 37%),linear-gradient(130deg,#142839,#203a46)}.gate{position:relative;width:min(100%,460px);padding:51px 48px;background:#f7f6f0;border:1px solid #ffffff66;box-shadow:0 30px 90px #07172150}.gate:before{content:"ZS / 孙振刚";display:block;font:700 12px/1.5 var(--sans);letter-spacing:.16em;color:#223c47;margin-bottom:50px}.gate:after{content:"";position:absolute;top:0;left:0;width:78px;height:3px;background:#bf9c6e}.gate h1{font-family:var(--serif);font-size:34px;letter-spacing:.02em;margin:15px 0}.gate p{color:#64736f;font-size:14px}.gate label{display:block;margin:31px 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em}.gate input{width:100%;height:51px;background:transparent;border:1px solid #bac7be;padding:0 14px;font-size:16px}.gate button{width:100%;height:51px;margin-top:14px;background:#1d3a40;color:white;border:0;font:600 13px var(--sans);letter-spacing:.04em;cursor:pointer}.gate button:hover{background:#31554f}.gate button:disabled{opacity:.6}.gate #message{min-height:1.5em;color:#9b443e;font-size:13px}.gate .eyebrow{font-size:10px}@media(max-width:500px){.gate{padding:38px 28px}.gate:before{margin-bottom:38px}}</style><script defer src="gate.js"></script></head><body class="locked"><main class="gate"><span class="eyebrow">PRIVATE ACCESS</span><h1>访问个人简历</h1><p>请输入访问密码，查看中英文简历及业务经历。</p><form id="unlock"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">查看简历 →</button><p id="message" role="status" aria-live="polite"></p></form></main></body></html>
